<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="교실에서 학생들이 휴대폰으로 번호를 고르고 교사가 당첨 번호를 추첨하는 실시간 로또 게임">
  <title>실시간 로또 게임</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #fff8df;
      --panel: #ffffff;
      --panel-warm: #fff0b8;
      --line: rgba(132, 92, 10, 0.2);
      --text: #2f2106;
      --muted: #72551b;
      --gold: #ffc928;
      --gold-dark: #e59400;
      --orange: #f97316;
      --red: #dc2626;
      --green: #16834a;
      --shadow: 0 18px 42px rgba(148, 91, 9, 0.18);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(255, 201, 40, 0.32), transparent 36%),
        repeating-linear-gradient(90deg, rgba(229, 148, 0, 0.08) 0 1px, transparent 1px 84px),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .app-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Outfit", "Noto Sans KR", sans-serif;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 2px solid #fef3c7;
      border-radius: 14px;
      color: #7c2d12;
      background: linear-gradient(180deg, #ffe066, var(--gold));
      box-shadow: 0 8px 18px rgba(217, 119, 6, 0.2);
    }

    .status {
      min-height: 28px;
      margin: 0;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.78);
      font-size: 0.92rem;
    }

    .status:empty::before {
      content: "준비됨";
    }

    .status[data-tone="success"] {
      border-color: rgba(22, 131, 74, 0.26);
      color: var(--green);
      background: rgba(236, 253, 245, 0.92);
    }

    .status[data-tone="error"] {
      border-color: rgba(220, 38, 38, 0.28);
      color: var(--red);
      background: rgba(254, 242, 242, 0.94);
    }

    main {
      display: block;
    }

    [hidden] {
      display: none !important;
    }

    .screen {
      min-height: calc(100vh - 150px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
      gap: 24px;
      align-items: stretch;
    }

    .hero-copy,
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
    }

    .hero-copy {
      padding: clamp(28px, 5vw, 54px);
      overflow: hidden;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 7px 11px;
      border: 1px solid rgba(217, 119, 6, 0.24);
      border-radius: 12px;
      color: #9a3412;
      background: #fff7d6;
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.12;
    }

    h1 {
      max-width: 9em;
      font-size: clamp(2.45rem, 7vw, 5.4rem);
      font-weight: 900;
    }

    h2 {
      font-size: clamp(1.7rem, 4vw, 2.7rem);
      font-weight: 900;
    }

    h3 {
      font-size: clamp(1.25rem, 2.6vw, 1.8rem);
      font-weight: 900;
    }

    .subtitle {
      max-width: 620px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1.7;
    }

    .lotto-balls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 34px;
    }

    .ball {
      display: grid;
      width: clamp(42px, 7vw, 64px);
      height: clamp(42px, 7vw, 64px);
      place-items: center;
      border-radius: 50%;
      color: #3b2500;
      background: radial-gradient(circle at 32% 26%, #ffffff 0 12%, var(--gold) 13% 62%, var(--gold-dark) 63% 100%);
      box-shadow: inset -5px -8px 0 rgba(120, 53, 15, 0.16), 0 8px 18px rgba(217, 119, 6, 0.2);
      font-family: "Outfit", sans-serif;
      font-weight: 800;
    }

    .panel {
      padding: 24px;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 16px;
    }

    .panel-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 12px;
      color: #7c2d12;
      background: var(--panel-warm);
    }

    .panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .field-group {
      display: grid;
      gap: 8px;
    }

    label {
      color: #593d08;
      font-size: 0.95rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(131, 92, 11, 0.22);
      border-radius: 12px;
      padding: 0 14px;
      color: var(--text);
      background: #fffdf5;
      outline: none;
    }

    input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.14);
    }

    .primary-btn,
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 800;
    }

    .primary-btn {
      color: #3b2500;
      background: linear-gradient(180deg, #ffe066, var(--gold));
      box-shadow: 0 12px 20px rgba(217, 119, 6, 0.22);
    }

    .primary-btn:hover {
      background: linear-gradient(180deg, #ffed93, #ffd33d);
    }

    .secondary-btn {
      color: #7c2d12;
      border: 1px solid rgba(217, 119, 6, 0.24);
      background: #fff7d6;
    }

    .teacher-note {
      min-height: 24px;
      font-size: 0.94rem;
    }

    .placeholder-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 24px;
      align-items: start;
    }

    .teacher-layout {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .room-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
    }

    .room-code {
      display: inline-flex;
      align-items: center;
      min-height: 56px;
      margin-top: 8px;
      padding: 0 16px;
      border: 2px dashed rgba(217, 119, 6, 0.4);
      border-radius: 12px;
      color: #7c2d12;
      background: #fff7d6;
      font-family: "Outfit", sans-serif;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .url-box {
      overflow-wrap: anywhere;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255, 247, 214, 0.82);
      font-size: 0.92rem;
    }

    .qr-box {
      display: grid;
      width: 220px;
      min-height: 220px;
      place-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #ffffff;
    }

    .teacher-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .teacher-stats div {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.88);
    }

    .teacher-stats strong {
      display: block;
      font-family: "Outfit", sans-serif;
      font-size: 2rem;
      line-height: 1;
    }

    .teacher-stats span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-weight: 800;
    }

    .student-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      min-height: 48px;
      color: var(--muted);
    }

    .student-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 10px;
      color: var(--text);
      background: #fffdf5;
      font-weight: 800;
    }

    .round-controls {
      display: grid;
      grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: end;
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .student-layout {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    .selected-strip {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
      background: rgba(255, 255, 255, 0.96);
    }

    .selected-strip > span {
      color: var(--muted);
      font-weight: 900;
    }

    .ball-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .lotto-ball {
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #111827;
      font-weight: 900;
      box-shadow: inset 0 -4px 8px rgba(15, 23, 42, 0.15);
    }

    .ball-empty {
      color: #94a3b8;
      background: #f1f5f9;
      box-shadow: none;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0;
    }

    .number-btn {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: #ffffff;
      font-weight: 900;
    }

    .number-btn[aria-pressed="true"] {
      border-color: var(--orange);
      background: var(--gold);
    }

    .number-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .student-result {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fffdf5;
    }

    @media (max-width: 860px) {
      .topbar,
      .hero,
      .placeholder-layout,
      .room-board {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: stretch;
      }

      .hero {
        display: grid;
      }

      .teacher-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .round-controls {
        grid-template-columns: 1fr;
      }

      .qr-box {
        width: min(100%, 260px);
      }
    }

    @media (max-width: 520px) {
      .app-shell {
        width: min(100% - 20px, 1120px);
        padding: 18px 0;
      }

      .hero-copy,
      .panel {
        padding: 18px;
      }

      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="실시간 로또 게임">
        <span class="brand-mark"><i class="fa-solid fa-ticket" aria-hidden="true"></i></span>
        <span>Classroom Lotto</span>
      </div>
      <p id="app-status" class="status" data-tone="neutral" aria-live="polite"></p>
    </header>

    <main>
      <section id="start-screen" class="screen" data-screen hidden>
        <div class="hero">
          <div class="hero-copy">
            <p class="eyebrow"><i class="fa-solid fa-bolt" aria-hidden="true"></i> 실시간 교실 활동</p>
            <h1>실시간 로또 게임</h1>
            <p class="subtitle">학생들은 휴대폰에서 로또 번호를 고르고, 교사는 화면에서 당첨 번호를 추첨합니다. QR 코드와 방 코드로 빠르게 접속할 수 있습니다.</p>
            <div class="lotto-balls" aria-label="로또 번호 예시">
              <span class="ball">7</span>
              <span class="ball">12</span>
              <span class="ball">19</span>
              <span class="ball">28</span>
              <span class="ball">34</span>
              <span class="ball">41</span>
            </div>
          </div>

          <div class="stack">
            <section class="panel" aria-labelledby="teacher-start-title">
              <div class="panel-header">
                <span class="panel-icon"><i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i></span>
                <h3 id="teacher-start-title">교사용 시작</h3>
              </div>
              <p>교사 계정으로 로그인한 뒤 실시간 로또 활동 방을 만듭니다.</p>
              <div class="stack">
                <button id="teacher-start-btn" class="primary-btn" type="button">
                  <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                  교사 로그인 후 방 만들기
                </button>
                <p id="teacher-email" class="teacher-note">로그인 전입니다.</p>
              </div>
            </section>

            <section class="panel" aria-labelledby="student-start-title">
              <div class="panel-header">
                <span class="panel-icon"><i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i></span>
                <h3 id="student-start-title">학생 입장</h3>
              </div>
              <form id="student-join-form" class="stack">
                <div class="field-group">
                  <label for="student-room-code">방 코드</label>
                  <input id="student-room-code" name="room" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="예: 123456">
                </div>
                <div class="field-group">
                  <label for="student-name">이름</label>
                  <input id="student-name" name="name" autocomplete="name" maxlength="20" placeholder="이름을 입력하세요">
                </div>
                <button class="secondary-btn" type="submit">
                  <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                  참여하기
                </button>
              </form>
            </section>
          </div>
        </div>
      </section>

      <section id="teacher-screen" class="screen teacher-layout" data-screen hidden>
        <section class="panel room-board" aria-labelledby="teacher-room-title">
          <div>
            <div class="panel-header">
              <span class="panel-icon"><i class="fa-solid fa-crown" aria-hidden="true"></i></span>
              <h2 id="teacher-room-title">교사용 로또 방</h2>
            </div>
            <p class="eyebrow">방 코드</p>
            <div id="teacher-room-code" class="room-code" aria-label="방 코드">------</div>
            <div id="student-room-url" class="url-box" aria-label="학생 입장 주소"></div>
          </div>
          <div id="qr-code" class="qr-box" aria-label="학생 접속 QR 코드"></div>
        </section>

        <section class="teacher-stats" aria-label="방 현황">
          <div><strong id="student-count">0</strong><span>접속</span></div>
          <div><strong id="submitted-count">0</strong><span>제출</span></div>
          <div><strong id="unsubmitted-count">0</strong><span>미제출</span></div>
          <div><strong id="timer-display">02:00</strong><span>남은 시간</span></div>
        </section>

        <section class="panel round-controls" aria-label="라운드 제어">
          <div class="field-group">
            <label for="timer-seconds">제한 시간</label>
            <input id="timer-seconds" type="number" min="10" max="600" step="10" value="120">
          </div>
          <div class="preset-row">
            <button class="secondary-btn timer-preset" type="button" data-seconds="30">30초</button>
            <button class="secondary-btn timer-preset" type="button" data-seconds="60">1분</button>
            <button class="secondary-btn timer-preset" type="button" data-seconds="120">2분</button>
            <button class="secondary-btn timer-preset" type="button" data-seconds="180">3분</button>
          </div>
          <button id="start-round-btn" class="primary-btn" type="button">라운드 시작</button>
          <button id="close-round-btn" class="secondary-btn" type="button" disabled>제출 마감</button>
        </section>

        <section class="panel" aria-labelledby="student-list-title">
          <div class="panel-header">
            <span class="panel-icon"><i class="fa-solid fa-users" aria-hidden="true"></i></span>
            <h3 id="student-list-title">참가 학생</h3>
          </div>
          <div id="student-list" class="student-list">학생 접속 대기 중...</div>
        </section>
      </section>

      <section id="student-screen" class="screen student-layout" data-screen hidden>
        <section id="student-join-panel" class="panel" aria-labelledby="student-active-title">
          <div class="panel-header">
            <span class="panel-icon"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></span>
            <h3 id="student-active-title">이름 입력</h3>
          </div>
          <form id="student-join-form-active" class="stack">
            <div class="field-group">
              <label>방 코드</label>
              <div id="student-room-code-label" class="url-box" aria-live="polite">------</div>
              <input id="student-room-code-active" name="room" type="hidden">
            </div>
            <div class="field-group">
              <label for="student-name-active">이름</label>
              <input id="student-name-active" name="name" autocomplete="name" maxlength="20" placeholder="이름을 입력하세요">
            </div>
            <button class="secondary-btn" type="submit">
              <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
              참여하기
            </button>
          </form>
        </section>

        <section id="student-game-panel" class="panel" hidden>
          <div class="selected-strip">
            <span>내 번호</span>
            <div id="selected-balls" class="ball-row"></div>
          </div>
          <div id="number-grid" class="number-grid" aria-label="1부터 45까지 번호 선택"></div>
          <button id="submit-ticket-btn" class="primary-btn" type="button" disabled>6개 번호 제출</button>
          <div id="student-result" class="student-result" hidden></div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="./js/lotto-app.js"></script>
</body>
</html>
